<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#05080d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pool">
    <meta name="robots" content="noindex,nofollow">
    <title>Pool</title>
    <link rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23071019'/%3E%3Cpath d='M4 21c2.5 0 2.5-2.2 5-2.2s2.5 2.2 5 2.2 2.5-2.2 5-2.2 2.5 2.2 5 2.2 2.5-2.2 5-2.2' stroke='%2338bdf8' stroke-width='2.2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="apple-touch-icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23071019'/%3E%3Cpath d='M20 118c14 0 14-12 28-12s14 12 28 12 14-12 28-12 14 12 28 12 14-12 28-12' stroke='%2338bdf8' stroke-width='11' fill='none' stroke-linecap='round'/%3E%3Cpath d='M20 88c14 0 14-12 28-12s14 12 28 12 14-12 28-12 14 12 28 12 14-12 28-12' stroke='%230ea5e9' stroke-width='11' fill='none' stroke-linecap='round' opacity='.6'/%3E%3C/svg%3E">
    <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    :root {
      --bg: #05080d;
      --ink: #eaf4ff;
      --dim: #7d93ab;
      --faint: #4a5a6d;
      --card: #0d1622;
      --edge: #1c2b3d;
      --cool: #38bdf8;
      --warm: #fbbf24;
      --hot: #fb7185;
      --good: #34d399;
      --accent: var(--cool);
      --pad: clamp(16px,4.5vw,24px);
    }
    html,
    body {
      margin: 0;
      height: 100%;
    }
    body {
      background: var(--bg);
      color: var(--ink);
      font: 400 16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
        env(safe-area-inset-left);
      overflow-x: hidden;
    }
    /* Deep water: a slow gradient that never reads as a flat black rectangle. */
    body::before {
      content: "";
      position: fixed;
      inset: -40% -20% auto -20%;
      height: 80%;
      z-index: -1;
      background: radial-gradient(60% 60% at 50% 0%,rgba(56,189,248,.16),transparent 70%);
      pointer-events: none;
    }
    .wrap {
      max-width: 560px;
      margin: 0 auto;
      padding: var(--pad) var(--pad) 48px;
    }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: 8px 0 22px;
    }
    h1 {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -.02em;
      margin: 0;
    }
    #status {
      font-size: 13px;
      color: var(--dim);
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--faint);
      transition: background .4s;
    }
    .dot.live {
      background: var(--good);
      box-shadow: 0 0 10px var(--good);
    }
    .dot.busy {
      background: var(--warm);
      animation: pulse 1s ease-in-out infinite;
    }
    .dot.bad {
      background: var(--hot);
    }
    @keyframes pulse {
      50% {
        opacity: .25;
      }
    }

    .card {
      background: linear-gradient(168deg,var(--card),#0a121c);
      border: 1px solid var(--edge);
      border-radius: 22px;
      padding: 20px var(--pad);
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
    }
    /* The card carries the body's own temperature as a light source. */
    .card::after {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: 22px;
      pointer-events: none;
      background: radial-gradient(120% 80% at 50% -20%,color-mix(in srgb,var(--accent)
        22%,transparent),transparent 60%);
      opacity: 0;
      transition: opacity .6s;
    }
    .card.on::after {
      opacity: 1;
    }
    .card.heating {
      border-color: color-mix(in srgb,var(--warm) 45%,var(--edge));
    }

    .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 4px;
    }
    .name {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--dim);
    }
    .pill {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
      padding: 5px 11px;
      border-radius: 999px;
      border: 1px solid var(--edge);
      color: var(--faint);
      white-space: nowrap;
    }
    .pill.live {
      color: var(--accent);
      border-color: color-mix(in srgb,var(--accent) 50%,transparent);
      background: color-mix(in srgb,var(--accent) 10%,transparent);
    }
    .pill.heating {
      color: var(--warm);
      border-color: color-mix(in srgb,var(--warm) 55%,transparent);
      background: color-mix(in srgb,var(--warm) 12%,transparent);
    }

    .readout {
      display: flex;
      align-items: flex-end;
      gap: 14px;
      margin: 10px 0 20px;
    }
    .temp {
      font-size: 66px;
      line-height: .92;
      font-weight: 250;
      letter-spacing: -.045em;
      color: var(--accent);
      transition: color .8s;
      text-shadow: 0 0 34px color-mix(in srgb,var(--accent) 30%,transparent);
    }
    .temp .deg {
      font-size: 26px;
      font-weight: 400;
      vertical-align: top;
      line-height: 1;
      margin-left: 2px;
      opacity: .55;
    }
    .target {
      font-size: 13px;
      color: var(--dim);
      padding-bottom: 11px;
      line-height: 1.35;
    }
    .target b {
      color: var(--ink);
      font-weight: 600;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    button {
      font: inherit;
      color: inherit;
      border: 0;
      background: none;
      cursor: pointer;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 52px;
      border: 1px solid var(--edge);
      border-radius: 15px;
      background: rgba(255,255,255,.028);
      font-size: 14.5px;
      font-weight: 600;
      letter-spacing: .01em;
      transition: transform .1s,background .25s,border-color .25s,color .25s;
    }
    .btn:active {
      transform: scale(.965);
    }
    .btn[aria-pressed="true"] {
      background: color-mix(in srgb,var(--accent) 17%,transparent);
      border-color: color-mix(in srgb,var(--accent) 60%,transparent);
      color: var(--accent);
      box-shadow: inset 0 0 22px color-mix(in srgb,var(--accent) 14%,transparent);
    }
    .btn.heat[aria-pressed="true"] {
      background: color-mix(in srgb,var(--warm) 17%,transparent);
      border-color: color-mix(in srgb,var(--warm) 60%,transparent);
      color: var(--warm);
      box-shadow: inset 0 0 22px color-mix(in srgb,var(--warm) 14%,transparent);
    }
    .btn[disabled] {
      opacity: .4;
      pointer-events: none;
    }
    .btn svg {
      width: 17px;
      height: 17px;
      flex: none;
    }

    .stepper {
      grid-column: 1/-1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid var(--edge);
      border-radius: 15px;
      padding: 6px;
      background: rgba(255,255,255,.028);
    }
    .stepper button {
      width: 54px;
      height: 46px;
      border-radius: 11px;
      font-size: 23px;
      font-weight: 300;
      color: var(--dim);
      transition: background .2s,color .2s;
    }
    .stepper button:active {
      background: rgba(255,255,255,.07);
      color: var(--ink);
    }
    .stepper button[disabled] {
      opacity: .3;
      pointer-events: none;
    }
    .stepper .val b {
      transition: color .3s;
    }
    .stepper .val {
      text-align: center;
      line-height: 1.15;
    }
    .stepper .val b {
      display: block;
      font-size: 21px;
      font-weight: 600;
      letter-spacing: -.02em;
    }
    .stepper .val span {
      font-size: 10.5px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--faint);
    }

    .swatches {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      padding: 2px 0 2px;
    }
    .sw {
      flex: 0 1 auto;
      min-height: 44px;
      padding: 0 15px;
      border-radius: 999px;
      border: 1px solid var(--edge);
      background: rgba(255,255,255,.03);
      font-size: 13.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: transform .1s,border-color .25s;
    }
    .sw:active {
      transform: scale(.95);
    }
    .sw i {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--c);
      box-shadow: 0 0 11px var(--c);
      flex: none;
    }
    .sw[aria-pressed="true"] {
      border-color: var(--c);
      background: color-mix(in srgb,var(--c) 16%,transparent);
    }

    .note {
      display: flex;
      gap: 9px;
      font-size: 13px;
      line-height: 1.4;
      color: var(--warm);
      background: color-mix(in srgb,var(--warm) 9%,transparent);
      border: 1px solid color-mix(in srgb,var(--warm) 28%,transparent);
      border-radius: 13px;
      padding: 11px 13px;
      margin-top: 14px;
    }
    .note svg {
      width: 15px;
      height: 15px;
      flex: none;
      margin-top: 1px;
    }
    .err {
      color: var(--hot);
      background: color-mix(in srgb,var(--hot) 9%,transparent);
      border-color: color-mix(in srgb,var(--hot) 30%,transparent);
    }

    footer {
      text-align: center;
      font-size: 12px;
      color: var(--faint);
      margin-top: 26px;
      line-height: 1.7;
    }
    footer button {
      color: var(--dim);
      text-decoration: underline;
      text-underline-offset: 3px;
      font-size: 12px;
    }

    .skel {
      animation: breathe 1.6s ease-in-out infinite;
    }
    @keyframes breathe {
      50% {
        opacity: .42;
      }
    }
    @media (prefers-reduced-motion:reduce) {
      * {
        animation: none!important;
        transition: none!important;
      }
    }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Pool</h1>
        <div
          id="status"><span class="dot" id="dot"></span><span id="statusText">Connecting</span></div>
      </header>
      <main id="app">
        <div class="card skel" style="height:210px"></div>
        <div class="card skel" style="height:210px"></div>
      </main>
      <footer>
        <div id="stamp"></div>
        <button id="refresh" type="button">Refresh</button>
      </footer>
    </div>
    <script>
    (function () {
      "use strict";
      // This file is public. It holds no credential, and must not: the key arrives in
      // the URL *fragment*, which browsers never send to any server, so it appears in
      // no access log, no referrer and no CDN cache — including GitHub's. It lives
      // only in the home-screen shortcut you save.
      //
      // Set this to your own Supabase functions host. It is not a secret; the key is.
      var API_ORIGIN = "https://ataxrekskpdhthtgpyze.functions.supabase.co";
      var KEY = "", BASE = "";
      function readKey() {
        KEY = decodeURIComponent(String(location.hash || "").replace(/^#/, "")).trim();
        BASE = API_ORIGIN + "/app/" + encodeURIComponent(KEY) + "/api";
      }

      var COLOURS = [
        ["WHITER", "White", "#f4f7fb"],
        ["BLUER", "Blue", "#3b82f6"],
        ["GREENR", "Green", "#22c55e"],
        ["REDR", "Red", "#ef4444"],
        ["MAGNTAR", "Magenta", "#d946ef"],
        ["SAMMOD", "Sam", "#38bdf8"],
        ["PARTY", "Party", "#a855f7"],
        ["ROMAN", "Romance", "#fb7185"],
        ["SSET", "Sunset", "#fb923c"],
        ["AMERCA", "American", "#60a5fa"],
      ];
      var ICON = {
        power:
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M12 3v9"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/></svg>',
        flame:
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2.5s5.5 4.6 5.5 9.5a5.5 5.5 0 0 1-11 0c0-1.6.7-3 1.5-4 .2 1.3 1 2.2 2 2.2 1.4 0 2-1.2 2-3 0-1.9-.5-3.4-.5-4.7z"/></svg>',
        bulb:
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18h6"/><path d="M10 21.5h4"/><path d="M12 2.5a6.5 6.5 0 0 0-3.8 11.8c.5.4.8 1 .8 1.7h6c0-.7.3-1.3.8-1.7A6.5 6.5 0 0 0 12 2.5z"/></svg>',
        warn:
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 8.5v5"/><path d="M12 17h.01"/><circle cx="12" cy="12" r="9.2"/></svg>',
      };

      var app = document.getElementById("app");
      var dot = document.getElementById("dot");
      var statusText = document.getElementById("statusText");
      var stamp = document.getElementById("stamp");
      var state = null, busy = false, timer = null;

      function esc(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }

      /* Cold water reads blue, bath-warm reads amber. The colour is the reading.
       Interpolated through near-white rather than by rotating hue: a straight
       blue-to-amber sweep passes through green, and green water reads as algae,
       which is the one thing a pool app must never accidentally say. */
      var RAMP = [[60, [56, 189, 248]], [82, [224, 242, 254]], [104, [251, 191, 36]]];
      function tint(t) {
        if (t === null || t === undefined) return "var(--cool)";
        var v = Math.max(RAMP[0][0], Math.min(RAMP[RAMP.length - 1][0], t)), i = 0;
        while (i < RAMP.length - 2 && v > RAMP[i + 1][0]) i++;
        var a = RAMP[i], b = RAMP[i + 1];
        var k = (v - a[0]) / (b[0] - a[0]);
        var c = a[1].map(function (x, n) {
          return Math.round(x + (b[1][n] - x) * k);
        });
        return "rgb(" + c[0] + " " + c[1] + " " + c[2] + ")";
      }

      function setStatus(kind, text) {
        dot.className = "dot" + (kind ? " " + kind : "");
        statusText.textContent = text;
      }

      function api(path, options) {
        return fetch(BASE + path, options).then(function (r) {
          return r.json().then(function (body) {
            if (!r.ok) throw new Error(body && body.message ? body.message : "HTTP " + r.status);
            return body;
          }, function () {
            throw new Error("HTTP " + r.status);
          });
        });
      }

      function load() {
        setStatus("busy", "Reading");
        return api("/state").then(function (data) {
          state = data;
          render();
          setStatus("live", "Live");
          stamp.textContent = "Updated " +
            new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
        }).catch(function (e) {
          setStatus("bad", "Offline");
          if (!state) {
            app.innerHTML = '<div class="card"><div class="note err">' + ICON.warn +
              "<span>" + esc(e.message) + "</span></div></div>";
          }
        });
      }

      /* Every write returns the panel's own read-back, so the UI is never guessing. */
      function send(path, payload, label, done) {
        if (busy) return;
        busy = true;
        setStatus("busy", label);
        render();
        api(path, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(payload),
        }).then(function (data) {
          if (data.bodies) {
            state.bodies = data.bodies;
            state.notes = data.notes || [];
          }
          if (data.lights) state.lights = data.lights;
          busy = false;
          if (done) done();
          setStatus("live", "Live");
          render();
          // The panel can be mid-transition right after a switch; a second read a
          // moment later is what settles it.
          clearTimeout(timer);
          timer = setTimeout(load, 3500);
        }).catch(function (e) {
          busy = false;
          if (done) done();
          setStatus("bad", "Failed");
          render();
          var n = document.createElement("div");
          n.className = "note err";
          n.innerHTML = ICON.warn + "<span>" + esc(e.message) + "</span>";
          app.appendChild(n);
        });
      }

      function bodyCard(b) {
        var on = b.status === "ON";
        var shown = pending[b.objnam] != null ? pending[b.objnam] : b.setpoint;
        var heat = b.mode && b.mode !== "1";
        var accent = tint(b.temperature);
        var canHeat = (b.availableHeatModes || []).length > 1;
        return '<section class="card' + (on ? " on" : "") + (b.heating ? " heating" : "") +
          '" style="--accent:' + accent + '">' +
          '<div class="head"><span class="name">' + esc(b.name) + "</span>" +
          '<span class="pill' + (b.heating ? " heating" : (on ? " live" : "")) + '">' +
          (b.heating ? "Heating" : on ? "Running" : "Idle") + "</span></div>" +
          '<div class="readout"><div class="temp">' +
          (b.temperature == null ? "--" : b.temperature) + '<span class="deg">&deg;F</span></div>' +
          '<div class="target">' + (b.heating ? "Heating" : on ? "Circulating" : "Water") +
          "</div></div>" +
          '<div class="controls">' +
          '<button class="btn" type="button" aria-pressed="' + on + '" data-act="power" data-body="' +
          esc(b.objnam) + '" data-to="' + (!on) + '"' + (busy ? " disabled" : "") + ">" +
          ICON.power + (on ? "On" : "Off") + "</button>" +
          '<button class="btn heat" type="button" aria-pressed="' + !!heat +
          '" data-act="heat" data-body="' +
          esc(b.objnam) + '" data-to="' + (!heat) + '"' + (busy || !canHeat ? " disabled" : "") + ">" +
          ICON.flame + (heat ? "Heat on" : "Heat off") + "</button>" +
          '<div class="stepper">' +
          '<button type="button" data-act="temp" data-body="' + esc(b.objnam) + '" data-step="-1"' +
          (b.setpoint == null ? " disabled" : "") + ' aria-label="Lower target">&minus;</button>' +
          '<div class="val"><b' + (pending[b.objnam] != null ? ' style="color:var(--warm)"' : "") +
          ">" +
          (shown == null ? "--" : shown + "°F") + "</b><span>Target</span></div>" +
          '<button type="button" data-act="temp" data-body="' + esc(b.objnam) + '" data-step="1"' +
          (b.setpoint == null ? " disabled" : "") + ' aria-label="Raise target">+</button>' +
          "</div>" +
          "</div></section>";
      }

      function lightCard(l) {
        return '<section class="card' + (l.on ? " on" : "") + '" style="--accent:#a855f7">' +
          '<div class="head"><span class="name">' + esc(l.name) + "</span>" +
          '<span class="pill' + (l.on ? " live" : "") + '">' + (l.on ? "On" : "Off") + "</span></div>" +
          '<div class="controls" style="margin:14px 0 16px">' +
          '<button class="btn" style="grid-column:1/-1" type="button" aria-pressed="' + l.on +
          '" data-act="light" data-light="' + esc(l.objnam) + '" data-to="' + (!l.on) + '"' +
          (busy ? " disabled" : "") + ">" + ICON.bulb + (l.on ? "On" : "Off") + "</button>" +
          "</div>" +
          '<div class="swatches">' + COLOURS.map(function (c) {
            return '<button class="sw" type="button" style="--c:' + c[2] + '" aria-pressed="' +
              (l.colorMode === c[0]) + '" data-act="colour" data-light="' + esc(l.objnam) +
              '" data-to="' + c[0] + '"' + (busy ? " disabled" : "") + "><i></i>" + c[1] + "</button>";
          }).join("") + "</div></section>";
      }

      /* Holding + or - moves the number now and sends once the finger stops. Each
       write costs a panel round trip, so a degree per tap would make a five degree
       change five sequential waits. The pending value is shown in amber until the
       panel confirms it. */
      var pending = {}, nudgeTimer = null;
      function nudge(objnam, step) {
        var body = (state.bodies || []).filter(function (b) {
          return b.objnam === objnam;
        })[0];
        if (!body) return;
        var base = pending[objnam] != null ? pending[objnam] : body.setpoint;
        if (base == null) return;
        pending[objnam] = Math.max(40, Math.min(104, base + step));
        render();
        clearTimeout(nudgeTimer);
        nudgeTimer = setTimeout(function () {
          var target = pending[objnam];
          if (target == null || target === body.setpoint) {
            delete pending[objnam];
            render();
            return;
          }
          send("/body", { body: objnam, setpoint: target }, "Setting target", function () {
            delete pending[objnam];
          });
        }, 650);
      }

      function render() {
        if (!state) return;
        var html = (state.bodies || []).map(bodyCard).join("") +
          (state.lights || []).map(lightCard).join("");
        (state.notes || []).forEach(function (n) {
          html += '<div class="note">' + ICON.warn + "<span>" + esc(n) + "</span></div>";
        });
        app.innerHTML = html;
      }

      document.addEventListener("click", function (ev) {
        var el = ev.target.closest("[data-act]");
        if (!el || busy) return;
        var act = el.dataset.act, to = el.dataset.to;
        if (act === "power") {
          send(
            "/body",
            { body: el.dataset.body, on: to === "true" },
            to === "true" ? "Starting" : "Stopping",
          );
        } else if (act === "heat") {
          send("/body", { body: el.dataset.body, heat: to === "true" }, "Setting heat");
        } else if (act === "temp") nudge(el.dataset.body, Number(el.dataset.step));
        else if (act === "light") {
          send("/light", { light: el.dataset.light, on: to === "true" }, "Switching");
        } else if (act === "colour") {
          send("/light", { light: el.dataset.light, colorMode: to }, "Setting colour");
        }
      });

      document.getElementById("refresh").addEventListener("click", function () {
        if (!busy) load();
      });
      // A phone backgrounds the page constantly; re-read whatever it shows on return.
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden && !busy) load();
      });

      function boot() {
        readKey();
        if (KEY) {
          load();
          return;
        }
        setStatus("bad", "No key");
        app.innerHTML =
          '<section class="card"><div class="head"><span class="name">Setup</span></div>' +
          '<p style="color:var(--dim);font-size:14px;line-height:1.55;margin:14px 0 0">' +
          'Add your key to the end of this address, after a <b style="color:var(--ink)">#</b>, ' +
          "then use Share &rarr; Add to Home Screen so you never type it again.</p>" +
          '<p style="color:var(--faint);font-size:12.5px;margin:12px 0 0;word-break:break-all">' +
          location.href.split("#")[0] + '<b style="color:var(--cool)">#your-key</b></p></section>';
      }

      // Pasting the key onto the address bar only changes the fragment, which is
      // a same-document navigation: nothing reloads, and the key would sit there
      // unread until a manual refresh. That is the very first thing anyone does
      // with this page, so it has to work.
      addEventListener("hashchange", boot);
      boot();
    })();
    </script>
  </body>
</html>
